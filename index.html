<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCP Dictionary</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230F1218'/%3E%3Cpath d='M9 22V10l7 8 7-8v12' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>
(function(){var t="light";try{var s=localStorage.getItem("mcpDict.theme");t=s==="dark"?"dark":s==="light"?"light":(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}document.documentElement.dataset.theme=t})();
</script>
<style>
:root{
  --bg:#F7F8FA;--panel:#fff;--hover:#F0F2F5;--line:#E7E9EE;--line2:#D8DBE2;
  --tx:#0F1218;--mut:#6A7280;--faint:#A0A6B2;
  --ink:#0F1218;--onInk:#fff;--acc:#2D4BDB;--accBg:rgba(45,75,219,.14);
  --red:#D23B3B;--shadow:0 1px 2px rgba(15,18,24,.04),0 8px 24px rgba(15,18,24,.05);
  --rail:64px;color-scheme:light}
[data-theme=dark]{
  --bg:#0A0B0D;--panel:#111215;--hover:#181A1E;--line:#212328;--line2:#2E3138;
  --tx:#EDEEF0;--mut:#8C919B;--faint:#5C616B;
  --ink:#EDEEF0;--onInk:#0A0B0D;--acc:#93A6FF;--accBg:rgba(147,166,255,.24);
  --red:#F26B6B;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);
  font-family:"IBM Plex Sans Thai","Segoe UI","Noto Sans Thai",Tahoma,sans-serif;font-weight:400;
  -webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ---------- Right rail ---------- */
.rail{position:fixed;top:0;right:0;bottom:0;width:var(--rail);z-index:5;display:flex;flex-direction:column;align-items:center;
  gap:4px;padding:16px 0;background:var(--bg);border-left:1px solid var(--line);transition:background .25s,border-color .25s}
.rail .sp{flex:1}
.rail .sep{width:24px;height:1px;background:var(--line);margin:6px 0}
.mark{width:34px;height:34px;border-radius:10px;border:0;background:var(--ink);color:var(--onInk);display:grid;place-items:center;margin-bottom:14px;padding:0}
.rb{position:relative;width:42px;height:42px;display:grid;place-items:center;border:0;border-radius:12px;background:none;color:var(--mut);padding:0;transition:background .15s,color .15s}
.rb:hover{background:var(--hover);color:var(--tx)}
.rb.on{background:var(--hover);color:var(--tx)}
.rb svg,.mark svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rb::after,.mark::after,.lang::after{content:attr(data-tip);position:absolute;right:calc(100% + 12px);top:50%;transform:translate(4px,-50%);
  background:var(--ink);color:var(--onInk);font-size:12px;font-weight:500;line-height:1;padding:8px 10px;border-radius:8px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.mark{position:relative}
.rb:hover::after,.rb:focus-visible::after,.mark:hover::after,.mark:focus-visible::after,.lang:hover::after,.lang:focus-visible::after{opacity:1;transform:translate(0,-50%)}
.i-sun{display:none}
[data-theme=dark] .i-sun{display:block}[data-theme=dark] .i-moon{display:none}

/* ---------- Main ---------- */
main{max-width:820px;margin:0 auto;padding:0 28px 80px;margin-right:max(var(--rail),calc((100vw - 820px - var(--rail))/2 + var(--rail)));margin-left:auto}
.hero{text-align:center;padding:22vh 0 24px;transition:padding .25s}
.hero.compact{padding:44px 0 8px}
.logo{display:inline-block;font-size:clamp(30px,5.5vw,44px);font-weight:600;letter-spacing:-.035em;line-height:1.1;cursor:pointer;margin:0}
.count{color:var(--mut);font-size:14px;margin:10px 0 28px}
.hero.compact .count{display:none}
.hero.compact .logo{font-size:22px;margin-bottom:20px}
.sbox{position:relative;max-width:640px;margin:0 auto}
.sbox>svg{position:absolute;left:20px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:none;stroke:var(--faint);stroke-width:1.8;stroke-linecap:round;pointer-events:none}
.sbox input{width:100%;height:56px;padding:0 56px 0 52px;font-size:16px;background:var(--panel);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);
  transition:border-color .15s,box-shadow .15s,background .25s}
.sbox input::placeholder{color:var(--faint)}
.sbox input:focus{outline:none;border-color:var(--tx);box-shadow:0 0 0 4px var(--accBg)}
.sbox input::-webkit-search-cancel-button{display:none}
.kbd{position:absolute;right:16px;top:50%;transform:translateY(-50%);min-width:24px;height:24px;display:grid;place-items:center;font-size:12px;color:var(--mut);
  border:1px solid var(--line2);border-radius:6px;pointer-events:none}
.clr{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:8px;background:none;color:var(--mut);display:grid;place-items:center;padding:0}
.clr:hover{background:var(--hover);color:var(--tx)}
.clr svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}

.cats{display:flex;gap:8px;overflow-x:auto;padding:20px 0 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--mut);font-size:13px;white-space:nowrap;transition:all .15s}
.chip:hover{color:var(--tx);border-color:var(--faint)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--onInk)}
.meta{color:var(--mut);font-size:13px;margin:18px 2px 12px}

.list{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);transition:background .25s}
.item{display:grid;grid-template-columns:112px 1fr auto;gap:20px;align-items:start;padding:20px 22px;border-top:1px solid var(--line);cursor:pointer;transition:background .15s}
.item:first-child{border-top:0}
.item:hover,.item:focus-visible{background:var(--hover)}
.item:focus-visible{outline-offset:-2px}
.abbr{font-size:20px;font-weight:600;letter-spacing:-.015em;line-height:1.3;overflow-wrap:anywhere}
.full{font-size:15px;font-weight:500;line-height:1.4}
.th{font-size:14px;color:var(--tx);margin-top:3px;opacity:.82}
.desc{font-size:13.5px;color:var(--mut);line-height:1.7;margin-top:8px}
.desc:empty{display:none}
.tag{display:inline-block;margin-top:12px;font-size:12px;color:var(--mut);background:var(--hover);padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.item:hover .tag{background:var(--panel)}
.ia{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.item:hover .ia,.item:focus-within .ia{opacity:1}
@media(hover:none){.ia{opacity:1}}
.ib{width:32px;height:32px;border:0;border-radius:8px;background:none;color:var(--mut);display:grid;place-items:center;padding:0}
.ib:hover{background:var(--line);color:var(--tx)}
.ib.dng:hover{color:var(--red)}
.ib svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.empty{text-align:center;color:var(--mut);padding:56px 20px}
.empty p{margin:0 0 18px}
mark{background:var(--accBg);color:inherit;border-radius:3px;padding:0 1px}

/* ---------- Buttons & modals ---------- */
.btn{height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);font-size:14px;font-weight:500;transition:background .15s,opacity .15s}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--onInk)}
.btn.pri:hover{opacity:.88;background:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{opacity:.9;background:var(--red)}
.ov{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(8,9,11,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ov.show{display:flex}
.modal{width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 64px rgba(0,0,0,.28)}
.modal h2{margin:0 0 6px;font-size:18px;font-weight:600;letter-spacing:-.01em}
.modal p{color:var(--mut);font-size:14px;line-height:1.6;margin:8px 0 0}
label{display:block;font-size:12.5px;font-weight:500;color:var(--mut);margin:16px 0 6px}
.modal input,.modal select,.modal textarea{width:100%;padding:11px 12px;font-size:14.5px;background:var(--bg);border:1px solid var(--line2);border-radius:10px;transition:border-color .15s,box-shadow .15s}
.modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;border-color:var(--tx);box-shadow:0 0 0 4px var(--accBg)}
.modal textarea{resize:vertical}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:26px}
.vh{font-size:34px;font-weight:600;letter-spacing:-.03em;margin:0 0 8px;line-height:1.2}
.dl{margin:12px 0 0}
.dl div{padding:14px 0;border-top:1px solid var(--line)}
.dl dt{font-size:12.5px;color:var(--mut);font-weight:500}
.dl dd{margin:4px 0 0;line-height:1.6;font-size:15px}
#toast{position:fixed;bottom:28px;left:calc(50% - var(--rail)/2);transform:translate(-50%,16px);background:var(--ink);color:var(--onInk);font-size:14px;font-weight:500;padding:11px 20px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:20;box-shadow:var(--shadow);max-width:calc(100vw - 100px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--red);color:#fff}

/* ---------- Mobile: rail becomes bottom bar ---------- */
@media(max-width:720px){
  .rb::after,.mark::after,.lang::after{display:none}
  main{margin:0 auto;padding:0 18px calc(96px + env(safe-area-inset-bottom))}
  .rail{top:auto;left:0;width:auto;height:calc(64px + env(safe-area-inset-bottom));flex-direction:row;justify-content:space-around;padding:0 12px env(safe-area-inset-bottom);border-left:0;border-top:1px solid var(--line)}
  .rail .sp,.rail .sep,.mark{display:none}
  .rail{gap:0;overflow-x:auto}
  .lang{flex-direction:row;width:auto;margin:0}
  .lang span{width:30px}
  .hero{padding-top:14vh}
  .item{grid-template-columns:1fr auto;gap:6px 12px;padding:18px}
  .abbr{grid-column:1}.ia{grid-column:2;grid-row:1}
  .item>div:nth-child(2){grid-column:1/-1}
  #toast{left:50%;bottom:calc(80px + env(safe-area-inset-bottom))}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- additions ---- */
.rb[aria-pressed=true]{color:var(--acc)}
.bd{position:absolute;top:3px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--ink);color:var(--onInk);font-size:10px;font-weight:600;display:grid;place-items:center;pointer-events:none}
.lang{position:relative;width:42px;border:1px solid var(--line2);border-radius:11px;background:none;padding:2px;display:flex;flex-direction:column;gap:2px;margin:0 0 8px}
.lang span{height:22px;display:grid;place-items:center;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--mut);border-radius:8px;transition:background .15s,color .15s}
.lang span.on{background:var(--ink);color:var(--onInk)}
.modal.wide{max-width:560px}
.sh{font-size:13px;font-weight:600;margin:24px 0 4px}
.sh:first-of-type{margin-top:18px}
.sd{color:var(--mut);font-size:13.5px;line-height:1.6;margin:0 0 12px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn.sm{height:30px;padding:0 12px;font-size:13px;border-radius:8px}
.drop{border:1.5px dashed var(--line2);border-radius:14px;padding:26px 16px;text-align:center;color:var(--mut);font-size:14px;cursor:pointer;transition:all .15s}
.drop:hover,.drop.over{border-color:var(--tx);color:var(--tx);background:var(--hover)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;margin:0 0 8px;cursor:pointer;color:var(--tx);font-size:14px;font-weight:400;line-height:1.5}
.opt:has(input:checked){border-color:var(--tx);background:var(--hover)}
.modal input[type=radio]{width:auto;padding:0;margin:4px 0 0;accent-color:var(--tx)}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow.go{cursor:pointer}
.lrow.go:hover .lt{color:var(--acc)}
.lt{flex:1;min-width:0;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lt b{font-weight:600;margin-right:8px}
.lt span{color:var(--mut)}
.lt small{display:block;color:var(--faint);font-size:12px;margin-top:2px}
.lr{display:flex;gap:4px;align-items:center}
.lst{margin-top:10px;max-height:52vh;overflow:auto}
.none{text-align:center;color:var(--mut);padding:34px 0;font-size:14px}
.row.sb{justify-content:space-between}
#toast.act{pointer-events:auto;display:flex;align-items:center}
#toast button{border:0;background:none;color:inherit;font-weight:600;text-decoration:underline;margin-left:16px;padding:0;font-size:14px}
@media(max-width:720px){.lang{flex-direction:row;width:auto;margin:0}.lang span{width:30px}}

/* ---- v3 additions ---- */
.modal.xl{max-width:700px}
.modal input[type=checkbox]{width:auto;padding:0;margin:4px 0 0;accent-color:var(--tx)}
.ferr{color:var(--red);font-size:12.5px;margin:5px 2px 0}
.modal .invalid{border-color:var(--red)!important}
.bd.dot{min-width:9px;width:9px;height:9px;padding:0;top:8px;right:8px;background:var(--red)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px;margin:14px 0}
.sum div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel)}
.sum b{display:block;font-size:22px;font-weight:600;line-height:1.2}
.sum span{font-size:12px;color:var(--mut)}
.sum .e b{color:var(--red)}
.pv{max-height:32vh;overflow:auto;border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
.pv .g{position:sticky;top:0;background:var(--hover);font-size:12px;font-weight:600;padding:7px 12px;color:var(--mut);border-bottom:1px solid var(--line)}
.pv .r{padding:9px 12px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.5}
.pv .g+.r{border-top:0}
.pv .r b{font-weight:600;margin-right:6px}
.pv .r small{display:block;color:var(--mut);font-size:12.5px;overflow-wrap:anywhere}
.pv .r.bad small{color:var(--red)}
.pv .r.warn small.w{color:#B7791F}
.pv .more{padding:8px 12px;font-size:12.5px;color:var(--mut);border-top:1px solid var(--line)}
.lst.short{max-height:24vh}
.btn[disabled]{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
<nav class="rail" aria-label="Actions">
  <button class="rb on" id="bAdd" data-ti="tipAdd"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="rb" id="bBrowse" data-ti="tipBrowse" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
  <span class="sep"></span>
  <button class="rb" id="bHist" data-ti="tipHist"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></button>
  <button class="rb" id="bTrash" data-ti="tipTrash"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M9 7V4h6v3"/></svg><span class="bd" id="trashBd" hidden></span></button>
  <span class="sep"></span>
  <button class="rb" id="bBackup" data-ti="tipBackup"><svg viewBox="0 0 24 24"><path d="M7 4v13M3.5 13.5 7 17l3.5-3.5M17 20V7M13.5 10.5 17 7l3.5 3.5"/></svg><span class="bd dot" id="bkBd" hidden></span></button>
  <span class="sp"></span>
  <button class="lang" id="bLang" data-ti="tipLang"><span data-l="en">EN</span><span data-l="th">TH</span></button>
  <button class="rb" id="bTheme">
    <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
  </button>
</nav>

<main>
  <div class="hero compact" id="hero">
    <h1 class="logo" id="logo">MCP Dictionary</h1>
    <div class="count" id="count"></div>
    <div class="sbox">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" data-ph="searchPh" autocomplete="off">
      <button class="clr" id="bClr" data-ti2="clear" hidden><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
  </div>
  <div class="cats" id="cats" hidden></div>
  <div class="meta" id="meta" hidden></div>
  <div class="list" id="list" hidden></div>
</main>

<!-- Add / edit -->
<div class="ov" id="ovForm"><div class="modal">
  <h2 id="fTitle"></h2>
  <label data-i="lAbbr" data-req="1"></label><input id="fAbbr" maxlength="30">
  <label data-i="lFull" data-req="1"></label><input id="fFull">
  <label data-i="lThai" data-req="1"></label><input id="fTh">
  <label data-i="lDesc"></label><textarea id="fDesc" rows="3"></textarea>
  <label data-i="lCat" data-req="1"></label><select id="fCat"></select>
  <label data-i="lEx"></label><input id="fEx">
  <div class="row"><button class="btn" id="fCancel" data-i="cancel"></button><button class="btn pri" id="fSave" data-i="save"></button></div>
</div></div>

<!-- View -->
<div class="ov" id="ovView"><div class="modal">
  <div id="vBody"></div>
  <div class="row"><button class="btn" id="vCopy" data-i="copy"></button><button class="btn pri" id="vClose" data-i="close"></button></div>
</div></div>

<!-- Search history -->
<div class="ov" id="ovHist"><div class="modal wide">
  <h2 data-i="histTitle"></h2>
  <div class="lst" id="histList"></div>
  <div class="row sb"><button class="btn" id="hClear" data-i="clearAll"></button><button class="btn pri" id="hClose" data-i="close"></button></div>
</div></div>

<!-- Trash -->
<div class="ov" id="ovTrash"><div class="modal wide">
  <h2 data-i="trashTitle"></h2>
  <p data-i="trashNote"></p>
  <div class="lst" id="trashList"></div>
  <div class="row sb"><button class="btn" id="tEmpty" data-i="emptyTrash"></button><button class="btn pri" id="tClose" data-i="close"></button></div>
</div></div>

<!-- Export / import -->
<div class="ov" id="ovBackup"><div class="modal wide">
  <h2 data-i="bkTitle"></h2>
  <div class="sh" data-i="exportH"></div>
  <div class="btns">
    <button class="btn" id="exXlsx">Excel (.xlsx)</button>
  </div>
  <div class="sh" data-i="importH"></div>
  <div class="drop" id="drop" tabindex="0" role="button" data-i="drop"></div>
  <input type="file" id="file" accept=".xlsx,.xls,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
  <div class="row"><button class="btn pri" id="bkClose" data-i="close"></button></div>
</div></div>

<!-- Import preview -->
<div class="ov" id="ovImport"><div class="modal xl">
  <h2 id="impTitle"></h2>
  <p class="sd" id="impFile"></p>
  <div class="sum" id="impSum"></div>
  <div class="pv" id="impList"></div>
  <div class="row"><button class="btn" id="impCancel"></button><button class="btn pri" id="impGo"></button></div>
</div></div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
const CATS=["Engineering", "Procument", "Production", "Production control", "Quality assurance", "Safty and health", "Other"];
const KEY="engDict.v1";

/* ---------- data ---------- */
const ID_RE=/^T\d{3,}$/;
const fmtId=n=>"T"+String(n).padStart(4,"0");
const maxIdNum=a=>a.reduce((m,x)=>{const k=/^T(\d+)$/.exec(x.id||"");return k?Math.max(m,+k[1]):m},0);
const nextIdNum=()=>Math.max(maxIdNum(terms),maxIdNum(trash),SEEDMAX)+1;
let migrateNote=0;
function normalizeAll(){
  let ch=false;
  [...terms,...trash].forEach(x=>{
    ["abbr","full","thai","desc","ex"].forEach(k=>{const v=String(x[k]??"").replace(/\u00a0/g," ").trim();if(v!==x[k]){x[k]=v;ch=true}});
    if(typeof x.updatedAt!=="string"){x.updatedAt="";ch=true}
    if(typeof x.updatedBy!=="string"){x.updatedBy="";ch=true}
  });
  if(fixCats(terms))ch=true;if(fixCats(trash))ch=true;
  const all=[...terms,...trash],used=new Set();
  all.forEach(x=>{const id=String(x.id||"").toUpperCase();if(ID_RE.test(id)&&!used.has(id)){if(x.id!==id){x.id=id;ch=true}used.add(id)}else x.id=null});
  let n=Math.max(maxIdNum(all),SEEDMAX);
  all.forEach(x=>{
    if(x.id)return;
    const sid=SEEDID.get(norm(x.abbr));
    if(sid&&!used.has(sid))x.id=sid;else{do{n++}while(used.has(fmtId(n)));x.id=fmtId(n)}
    used.add(x.id);ch=true;
  });
  const seen=new Set(),dups=[];
  terms=terms.filter(x=>{const k=norm(x.abbr);if(!k)return true;if(seen.has(k)){dups.push(x);return false}seen.add(k);return true});
  if(dups.length){dups.forEach(x=>trash.unshift({...x,deletedAt:Date.now()}));migrateNote+=dups.length;ch=true}
  return ch;
}
function load(){
  const d=read(KEY,null);
  terms=Array.isArray(d)?d:SEED.map(x=>({...x}));
  trash=read(TRKEY,[]);if(!Array.isArray(trash))trash=[];
  hist=read(HKEY,[]);if(!Array.isArray(hist))hist=[];
  let ch=!Array.isArray(d);
  if(normalizeAll())ch=true;
  const lim=Date.now()-30*864e5,n=trash.length;
  trash=trash.filter(x=>x.deletedAt>lim);
  if(ch||trash.length!==n){store(KEY,terms);store(TRKEY,trash)}
  const sn=readSnaps();
  if(!sn[0]||new Date(sn[0].at).toDateString()!==new Date().toDateString())snapshot();
}
function fixCats(arr){
  let ch=false;
  arr.forEach(x=>{
    const c=String(x.cat??"").trim();
    if(CATS.includes(c)){if(c!==x.cat){x.cat=c;ch=true}return}
    const n=SEEDCAT[norm(x.abbr)]||CATS.find(k=>norm(k)===norm(c))||OLDCAT[norm(c)]||"Other";
    x.cat=n;ch=true;
  });
  return ch;
}
const save=()=>{store(KEY,terms);store(DIRTYKEY,1);updateBackupDot()},saveTrash=()=>store(TRKEY,trash),saveHist=()=>store(HKEY,hist);
const editor=()=>String(read(USERKEY,"")||"").trim();
const stampNow=()=>({updatedAt:new Date().toISOString(),updatedBy:editor()});
function fmtDate(v){
  if(!v)return"";if(typeof v==="string"&&v.length<=10)return v;
  const d=new Date(v);if(isNaN(d))return String(v);
  const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
/* version history (restorable copies) */
const SNAPMAX=10;
function readSnaps(){const s=read(SNAPKEY,[]);return Array.isArray(s)?s:[]}
function snapshot(reason){
  const sn=readSnaps(),json=JSON.stringify(terms);
  if(sn[0]&&JSON.stringify(sn[0].terms)===json)return;
  sn.unshift({at:Date.now(),reason:reason||"auto",n:terms.length,terms:JSON.parse(json)});
  store(SNAPKEY,sn.slice(0,SNAPMAX));
}
function restoreSnapshot(i){
  const sn=readSnaps(),s=sn[i];if(!s)return;
  if(!confirm(t("confirmSnap",fmtDate(new Date(s.at).toISOString()))))return;
  snapshot("restore");
  terms=JSON.parse(JSON.stringify(s.terms));normalizeAll();save();
  render();updateBadge();renderBackup();toast(t("snapDone"));
}
function updateBackupDot(){
  const lb=read(BKKEY,0),stale=!lb||Date.now()-lb>7*864e5,need=!!read(DIRTYKEY,0)&&stale;
  $("bkBd").hidden=!need;return need;
}
function toast(m,err,act,fn,ms){
  const el=$("toast");el.textContent="";
  const s=document.createElement("span");s.textContent=m;el.append(s);
  if(act){const b=document.createElement("button");b.textContent=act;b.onclick=()=>{el.className="";fn()};el.append(b)}
  el.className="show"+(err?" err":"")+(act?" act":"");
  clearTimeout(toast.h);toast.h=setTimeout(()=>el.className="",ms||(act?5000:2400));
}
function addHist(q){
  q=String(q||"").trim();if(q.length<2)return;
  hist=[q,...hist.filter(h=>norm(h)!==norm(q))].slice(0,20);saveHist();
}

/* ---------- search & render ---------- */
function score(x,q){
  const a=norm(x.abbr),f=norm(x.full),th=norm(x.thai),d=norm(x.desc+" "+x.ex+" "+x.cat+" "+(CATTH[x.cat]||""));
  if(a===q)return 100;if(a.startsWith(q))return 90;if(f.startsWith(q))return 80;
  if(a.includes(q))return 70;if(f.includes(q))return 60;if(th.includes(q))return 50;if(d.includes(q))return 30;
  const sub=s=>{let i=0;for(const c of s){if(c===q[i])i++;if(i===q.length)return true}return false};
  if(q.length>=2&&(sub(a)||sub(f)))return 10;
  return 0;
}
function hl(text,q){
  const s=esc(text);if(!q)return s;
  const i=norm(text).indexOf(q);if(i<0)return s;
  return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length));
}
const IC={
  copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg>',
  edit:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>',
  del:'<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M9 7V4h6v3"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>'
};
function render(){
  const q=norm($("q").value),show=!!q||browse;
  if(!show)cat="All";
  $("bClr").hidden=!q;
  $("bBrowse").setAttribute("aria-pressed",String(browse&&!q));
  ["cats","meta","list"].forEach(id=>$(id).hidden=!show);
  $("count").textContent=t("count",terms.length);
  $("hero").classList.toggle("compact",show);
  const used=[...new Set(terms.map(x=>x.cat))];
  $("cats").innerHTML=["All",...CATS.filter(c=>used.includes(c)),...used.filter(c=>!CATS.includes(c))]
    .map(c=>`<button class="chip${c===cat?" on":""}" data-cat="${esc(c)}">${esc(c==="All"?t("all"):catLabel(c))}</button>`).join("");
  const res=terms.filter(x=>cat==="All"||x.cat===cat).map(x=>({x,s:q?score(x,q):1})).filter(r=>r.s>0);
  res.sort((a,b)=>b.s-a.s||a.x.abbr.localeCompare(b.x.abbr));
  $("meta").textContent=q||cat!=="All"?t("found",res.length):t("browseAll");
  $("list").innerHTML=res.length?res.map(({x})=>`
    <div class="item" data-id="${x.id}" tabindex="0">
      <div class="abbr">${hl(x.abbr,q)}</div>
      <div>
        <div class="full">${hl(x.full,q)}</div>
        <div class="th">${hl(x.thai,q)}</div>
        <div class="desc">${esc(x.desc)}</div>
        <span class="tag">${esc(catLabel(x.cat))}</span>
      </div>
      <div class="ia">
        <button class="ib" data-a="copy" title="${t("copy")}" aria-label="${t("copy")}">${IC.copy}</button>
        <button class="ib" data-a="edit" title="${t("edit")}" aria-label="${t("edit")}">${IC.edit}</button>
        <button class="ib dng" data-a="del" title="${t("del")}" aria-label="${t("del")}">${IC.del}</button>
      </div>
    </div>`).join("")
    :`<div class="empty"><p>${esc(t("noMatch",$("q").value))}</p><button class="btn pri" id="bAddEmpty">${t("addThis")}</button></div>`;
}

/* ---------- add / edit / view / copy / delete ---------- */
function fillCatSelect(sel){
  const extra=sel&&!CATS.includes(sel)?[sel]:[];
  $("fCat").innerHTML=[...CATS,...extra].map(c=>`<option value="${esc(c)}">${esc(catLabel(c))}</option>`).join("");
  $("fCat").value=sel||CATS[0];
}
function openForm(id){
  editId=id||null;const x=terms.find(r=>r.id===id)||{};
  $("fTitle").textContent=t(id?"editTitle":"addTitle");
  fillCatSelect(x.cat);
  $("fAbbr").value=x.abbr||"";$("fFull").value=x.full||"";$("fTh").value=x.thai||"";
  $("fDesc").value=x.desc||"";$("fEx").value=x.ex||"";
  clearErrs();open("ovForm");$("fAbbr").focus();
}
function setErr(id,msg){
  const el=$(id);el.classList.toggle("invalid",!!msg);
  let e=el.nextElementSibling;
  if(!(e&&e.classList.contains("ferr"))){e=document.createElement("div");e.className="ferr";el.after(e)}
  e.textContent=msg||"";
}
const clearErrs=()=>["fAbbr","fFull","fTh","fCat"].forEach(i=>setErr(i,""));
function saveForm(){
  const o={abbr:$("fAbbr").value.trim(),full:$("fFull").value.trim(),thai:$("fTh").value.trim(),desc:$("fDesc").value.trim(),cat:$("fCat").value,ex:$("fEx").value.trim()};
  clearErrs();let bad=null;
  if(!o.abbr){setErr("fAbbr",t("eReq"));bad="fAbbr"}
  else if(terms.some(x=>x.id!==editId&&norm(x.abbr)===norm(o.abbr))){setErr("fAbbr",t("dup",o.abbr));bad="fAbbr"}
  if(!o.full){setErr("fFull",t("eReq"));bad=bad||"fFull"}
  if(!o.thai){setErr("fTh",t("eReq"));bad=bad||"fTh"}
  if(!CATS.includes(o.cat)){setErr("fCat",t("eCat"));bad=bad||"fCat"}
  if(bad){$(bad).focus();return}
  Object.assign(o,stampNow());
  if(editId){Object.assign(terms.find(x=>x.id===editId),o);toast(t("edited"))}
  else{terms.push({id:fmtId(nextIdNum()),...o});toast(t("added"))}
  save();shut("ovForm");editId=null;render();
}
function view(id){
  const x=terms.find(r=>r.id===id);if(!x)return;
  viewId=id;addHist($("q").value);
  $("vBody").innerHTML=`<h2 class="vh">${esc(x.abbr)}</h2><dl class="dl">
  <div><dt>${t("lFull")}</dt><dd>${esc(x.full)}</dd></div>
  <div><dt>${t("lThai")}</dt><dd>${esc(x.thai)}</dd></div>
  <div><dt>${t("lDesc")}</dt><dd>${esc(x.desc)||"-"}</dd></div>
  <div><dt>${t("lCat")}</dt><dd><span class="tag" style="margin-top:0">${esc(catLabel(x.cat))}</span></dd></div>
  <div><dt>${t("lEx")}</dt><dd>${esc(x.ex)||"-"}</dd></div>
  <div><dt>${t("lUpdated")}</dt><dd>${esc([fmtDate(x.updatedAt)||"-",x.updatedBy,x.id].filter(Boolean).join(" · "))}</dd></div></dl>`;
  open("ovView");
}
function copyText(s){
  const ok=()=>toast(t("copied"));
  const fb=()=>{const a=document.createElement("textarea");a.value=s;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();
    try{document.execCommand("copy")?ok():toast(t("copyFail"),1)}catch(e){toast(t("copyFail"),1)}a.remove()};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(s).then(ok,fb);else fb();
}
function copyTerm(id){
  const x=terms.find(r=>r.id===id);if(!x)return;
  addHist($("q").value);
  copyText(`${x.abbr} – ${x.full}${x.thai?` (${x.thai})`:""}`);
}
function trashTerm(id){
  const i=terms.findIndex(x=>x.id===id);if(i<0)return;
  const [x]=terms.splice(i,1);
  trash.unshift({...x,deletedAt:Date.now()});
  save();saveTrash();render();updateBadge();
  toast(t("trashed"),0,t("undo"),()=>restoreTerm(x.id));
}
function restoreTerm(id){
  const i=trash.findIndex(x=>x.id===id);if(i<0)return;
  const x=trash[i];
  if(terms.some(r=>norm(r.abbr)===norm(x.abbr)))return toast(t("dup",x.abbr),1);
  trash.splice(i,1);const {deletedAt,...rest}=x;terms.push(rest);
  save();saveTrash();render();updateBadge();
  if($("ovTrash").classList.contains("show"))renderTrash();
  toast(t("restored"));
}
function updateBadge(){const b=$("trashBd");b.hidden=!trash.length;b.textContent=trash.length>99?"99+":trash.length}

/* ---------- history & trash panels ---------- */
function renderHist(){
  $("histList").innerHTML=hist.length?hist.map((h,i)=>`
    <div class="lrow go" data-h="${i}"><div class="lt">${esc(h)}</div>
    <div class="lr"><button class="ib" data-hx="${i}" title="${t("remove")}" aria-label="${t("remove")}">${IC.x}</button></div></div>`).join("")
    :`<div class="none">${t("histEmpty")}</div>`;
  $("hClear").hidden=!hist.length;
}
function renderTrash(){
  $("trashList").innerHTML=trash.length?trash.map(x=>{
    const d=Math.max(1,30-Math.floor((Date.now()-x.deletedAt)/864e5));
    return `<div class="lrow"><div class="lt"><b>${esc(x.abbr)}</b><span>${esc(x.full)}</span><small>${t("daysLeft",d)}</small></div>
    <div class="lr"><button class="btn sm" data-r="${x.id}">${t("restore")}</button>
    <button class="ib dng" data-p="${x.id}" title="${t("delForever")}" aria-label="${t("delForever")}">${IC.del}</button></div></div>`}).join("")
    :`<div class="none">${t("trashEmpty")}</div>`;
  $("tEmpty").hidden=!trash.length;
}
function renderBackup(){}

/* ---------- export ---------- */
const HDR=["Abbreviation","Full Name","Thai Meaning","Description","Category","Example"];
const idNum=x=>{const k=/^T(\d+)$/.exec(x.id||"");return k?+k[1]:1e9};
const rowsOut=()=>[...terms].sort((a,b)=>idNum(a)-idNum(b)).map(x=>[x.abbr,x.full,x.thai,x.desc,x.cat,x.ex||""]);
const stamp=()=>new Date().toISOString().slice(0,10);
const stampT=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`};
let xlP=null;
function loadXLSX(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  return xlP||(xlP=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload=()=>window.XLSX?res(window.XLSX):(xlP=null,rej());
    s.onerror=()=>{xlP=null;rej()};
    document.head.appendChild(s);
  }));
}
function writeXLSX(X,name){
  const rows=rowsOut(),wb=X.utils.book_new();
  const ws=X.utils.aoa_to_sheet([HDR,...rows]);
  ws["!cols"]=[{wch:14},{wch:38},{wch:34},{wch:58},{wch:22},{wch:30}];
  ws["!autofilter"]={ref:`A1:F${rows.length+1}`};
  X.utils.book_append_sheet(wb,ws,"Terms");
  const wc=X.utils.aoa_to_sheet([["Category","Thai label"],...CATS.map(c=>[c,CATTH[c]||""])]);
  wc["!cols"]=[{wch:26},{wch:26}];X.utils.book_append_sheet(wb,wc,"Categories");
  X.writeFile(wb,name);
  store(BKKEY,Date.now());store(DIRTYKEY,0);updateBackupDot();
}
async function exportXLSX(){
  try{const X=await loadXLSX();writeXLSX(X,`mcp-dictionary-${stamp()}.xlsx`);toast(t("exported"));if($("ovBackup").classList.contains("show"))renderBackup()}
  catch(e){toast(t("xlsxFail"),1)}
}

/* ---------- import (Excel) : parse -> validate -> preview -> confirm ---------- */
const nk=s=>String(s??"").toLowerCase().replace(/[\s_*\-:./]/g,"");
const nkp=s=>nk(String(s??"").replace(/\(.*?\)/g,""));
const ALIAS={
  id:["id","termid","รหัส","รหัสคำศัพท์"],
  abbr:["abbr","abbreviation","acronym","code","คำย่อ"],
  full:["full","fullname","name","english","englishname","ชื่อเต็ม","คำเต็ม"],
  thai:["thai","thaimeaning","meaning","ความหมายภาษาไทย","ความหมาย","ภาษาไทย","ไทย"],
  desc:["desc","description","details","note","notes","คำอธิบาย","คำอธิบายเพิ่มเติม","หมายเหตุ"],
  cat:["cat","category","หมวดหมู่","หมวด"],
  ex:["ex","example","ตัวอย่าง","ตัวอย่างการใช้งาน"]
};
const AL=Object.fromEntries(Object.entries(ALIAS).map(([k,v])=>[k,v.map(nk)]));
function fieldOf(h){const a=nk(h),b=nkp(h);for(const k in AL)if(AL[k].includes(a)||(b&&AL[k].includes(b)))return k;return null}
function matrixToRecs(m){
  if(!m.length)return[];
  let map=m[0].map(fieldOf),start=1;
  if(!map.includes("abbr")){map=["abbr","full","thai","desc","cat","ex"];start=0}
  return m.slice(start).map((r,ix)=>{const o={_row:ix+start+1};map.forEach((k,i)=>{if(k&&o[k]===undefined)o[k]=r[i]});return o});
}
const FIELDS=["abbr","full","thai","desc","cat","ex"];
const FL={abbr:"lAbbr",full:"lFull",thai:"lThai",desc:"lDesc",cat:"lCat",ex:"lEx"};
const cl=v=>String(v??"").replace(/\u00a0/g," ").replace(/\r\n?/g,"\n").trim();
function matchCat(s){const v=s.replace(/\s+/g," ");if(!v)return null;return CATS.find(c=>norm(c)===norm(v)||CATTH[c]===v)||null}
function analyzeImport(recs,cur,trashArr,mode){
  const byId=new Map(cur.map(x=>[x.id,x])),byAbbr=new Map(cur.map(x=>[norm(x.abbr),x]));
  const used=new Set([...cur,...trashArr].map(x=>x.id));
  let n=Math.max(maxIdNum(cur),maxIdNum(trashArr),SEEDMAX);
  const seenA=new Map(),seenI=new Map(),hit=new Map();
  const out={add:[],upd:[],same:[],err:[],trash:[],valid:0};
  recs.forEach(r=>{
    const f={};FIELDS.forEach(k=>f[k]=cl(r[k]));
    const fid=cl(r.id).toUpperCase(),row=r._row;
    if(!fid&&FIELDS.every(k=>!f[k]))return;
    const miss=[["abbr","lAbbr"],["full","lFull"],["thai","lThai"],["cat","lCat"]].filter(([k])=>!f[k]).map(([,l])=>t(l));
    if(miss.length)return out.err.push({row,abbr:f.abbr||fid||"—",msg:t("eMissing",miss.join(", "))});
    const k=norm(f.abbr);
    if(seenA.has(k))return out.err.push({row,abbr:f.abbr,msg:t("eDupFile",seenA.get(k))});
    if(fid&&seenI.has(fid))return out.err.push({row,abbr:f.abbr,msg:t("eDupFile",seenI.get(fid))});
    const warns=[],c=matchCat(f.cat);
    if(!c)return out.err.push({row,abbr:f.abbr,msg:t("eBadCat",f.cat)});
    f.cat=c;
    const byI=fid?byId.get(fid):null,byA=byAbbr.get(k),old=byI||byA;
    if(byI&&byA&&byI!==byA)return out.err.push({row,abbr:f.abbr,msg:t("eConflict",byA.id)});
    if(old&&hit.has(old.id))return out.err.push({row,abbr:f.abbr,msg:t("eDupFile",hit.get(old.id))});
    seenA.set(k,row);if(fid)seenI.set(fid,row);out.valid++;
    if(old){
      hit.set(old.id,row);
      const changes=FIELDS.filter(q=>old[q]!==f[q]).map(q=>({k:q,from:old[q]||"",to:f[q]}));
      if(changes.length)out.upd.push({row,old,rec:f,changes,warns});else out.same.push({row,old});
    }else{
      let id=fid&&ID_RE.test(fid)&&!used.has(fid)?fid:null;
      if(!id){do{n++}while(used.has(fmtId(n)));id=fmtId(n)}
      used.add(id);out.add.push({row,id,rec:f,warns});
    }
  });
  if(mode==="sync"&&out.valid>0)cur.forEach(x=>{if(!hit.has(x.id))out.trash.push(x)});
  return out;
}
let pend=null;
const clip=(v,n)=>{v=String(v||"—");return v.length>n?v.slice(0,n)+"…":v};
function renderPreview(){
  if(!pend)return;
  const a=analyzeImport(pend.recs,terms,trash,"merge"),changes=a.add.length+a.upd.length;
  const box=(k,n,cls)=>`<div class="${cls||""}"><b>${n}</b><span>${t(k)}</span></div>`;
  const CAP=60;
  const more=n=>n>CAP?`<div class="more">${esc(t("more",n-CAP))}</div>`:"";
  $("impSum").hidden=false;
  if(a.err.length){
    $("impTitle").textContent=t("impBlock");
    $("impFile").textContent=t("impBlockNote",a.err.length);
    $("impSum").hidden=true;
    $("impList").hidden=false;
    $("impList").innerHTML=a.err.slice(0,CAP).map(e=>`<div class="r bad"><b>${esc(e.abbr)}</b><small>${esc(t("rowN",e.row))} · ${esc(e.msg)}</small></div>`).join("")+more(a.err.length);
    $("impCancel").textContent=t("close");$("impGo").hidden=true;return;
  }
  $("impTitle").textContent=t("impTitle");
  $("impFile").textContent=pend.name;
  $("impGo").hidden=!changes;$("impCancel").textContent=changes?t("cancel"):t("close");
  if(!changes){$("impSum").hidden=true;$("impList").hidden=false;$("impList").innerHTML=`<div class="none">${esc(t("impSame"))}</div>`;return}
  $("impSum").innerHTML=box("sNew",a.add.length)+box("sUpd",a.upd.length);
  $("impList").hidden=false;
  const items=[...a.upd.map(u=>`<div class="r"><b>${esc(u.old.abbr)}</b>${u.changes.map(c=>`<small>${esc(t(FL[c.k]))}: ${esc(clip(c.from,40))} → ${esc(clip(c.to,40))}</small>`).join("")}</div>`),
    ...a.add.map(x=>`<div class="r"><b>${esc(x.rec.abbr)}</b>${esc(x.rec.full)}</div>`)];
  $("impList").innerHTML=items.slice(0,CAP).join("")+more(items.length);
  $("impGo").textContent=t("impGo",changes);
}
function openPreview(recs,name){pend={recs,name};renderPreview();open("ovImport")}
function confirmImport(){
  if(!pend)return;
  const a=analyzeImport(pend.recs,terms,trash,"merge");
  if(a.err.length||!(a.add.length+a.upd.length))return;
  const before={terms:JSON.parse(JSON.stringify(terms)),trash:JSON.parse(JSON.stringify(trash))};
  snapshot("import");
  const st=stampNow();
  a.upd.forEach(u=>Object.assign(u.old,u.rec,st));
  a.add.forEach(x=>terms.push({id:x.id,...x.rec,...st}));
  save();pend=null;
  shut("ovImport");shut("ovBackup");render();updateBadge();
  toast(t("imported",a.add.length,a.upd.length,0,0),0,t("undoImport"),()=>{
    terms=before.terms;trash=before.trash;save();saveTrash();render();updateBadge();toast(t("undone"));
  },9000);
}
async function importFile(file){
  if(!/\.(xlsx|xlsm|xls)$/i.test(file.name)){toast(t("badFile"),1);return}
  if(file.size>10*1024*1024){toast(t("bigFile"),1);return}
  let recs;
  try{
    let X;try{X=await loadXLSX()}catch(e){throw "x"}
    const wb=X.read(await file.arrayBuffer(),{type:"array"});
    const sn=wb.SheetNames.find(n=>/^terms?$/i.test(n))||wb.SheetNames.find(n=>/term/i.test(n))||wb.SheetNames[0];
    recs=matrixToRecs(X.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:"",raw:false}));
  }catch(e){toast(e==="x"?t("xlsxFail"):t("badFile"),1);return}
  if(!recs.length||recs.length>5000){toast(t(recs.length?"bigFile":"emptyFile"),1);return}
  openPreview(recs,file.name);
}

/* ---------- navigation ---------- */
function home(){$("q").value="";cat="All";browse=false;render();scrollTo({top:0,behavior:"smooth"})}
function toggleBrowse(){browse=!browse;if(browse){$("q").value="";cat="All"}render();scrollTo({top:0,behavior:"smooth"})}

/* ---------- events ---------- */
$("q").addEventListener("input",()=>{if($("q").value)browse=false;render()});
$("q").addEventListener("keydown",e=>{if(e.key==="Escape")home();if(e.key==="Enter")addHist($("q").value)});
$("q").addEventListener("blur",()=>addHist($("q").value));
$("bClr").onclick=()=>{$("q").value="";render();$("q").focus()};
$("logo").onclick=home;
$("bAdd").onclick=()=>openForm();
$("bBrowse").onclick=toggleBrowse;
$("bHist").onclick=()=>{renderHist();open("ovHist")};
$("bTrash").onclick=()=>{renderTrash();open("ovTrash")};
$("bBackup").onclick=()=>{renderBackup();open("ovBackup")};
$("bLang").onclick=()=>setLang(lang==="en"?"th":"en");
$("bTheme").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
$("fSave").onclick=saveForm;$("fCancel").onclick=()=>shut("ovForm");
$("vClose").onclick=()=>shut("ovView");$("vCopy").onclick=()=>copyTerm(viewId);
$("hClose").onclick=()=>shut("ovHist");$("tClose").onclick=()=>shut("ovTrash");$("bkClose").onclick=()=>shut("ovBackup");
$("hClear").onclick=()=>{hist=[];saveHist();renderHist()};
$("tEmpty").onclick=()=>{if(trash.length&&confirm(t("confirmEmpty",trash.length))){trash=[];saveTrash();renderTrash();updateBadge()}};
$("histList").onclick=e=>{
  const x=e.target.closest("[data-hx]");
  if(x){hist.splice(+x.dataset.hx,1);saveHist();renderHist();return}
  const r=e.target.closest("[data-h]");
  if(r){browse=false;$("q").value=hist[+r.dataset.h];shut("ovHist");render();addHist($("q").value)}
};
$("trashList").onclick=e=>{
  const r=e.target.closest("[data-r]"),p=e.target.closest("[data-p]");
  if(r){const x=trash.find(y=>y.id===r.dataset.r);if(x&&confirm(t("confirmRestore",x.abbr)))restoreTerm(x.id)}
  if(p){const x=trash.find(y=>y.id===p.dataset.p);if(x&&confirm(t("confirmForever",x.abbr))){trash=trash.filter(y=>y.id!==x.id);saveTrash();renderTrash();updateBadge()}}
};
$("exXlsx").onclick=exportXLSX;
$("impCancel").onclick=()=>{pend=null;shut("ovImport")};
$("impGo").onclick=confirmImport;
["fAbbr","fFull","fTh"].forEach(id=>$(id).addEventListener("input",()=>setErr(id,"")));
$("fCat").addEventListener("change",()=>setErr("fCat",""));
addEventListener("storage",e=>{if(e.key===KEY||e.key===TRKEY){load();render();updateBadge();if($("ovBackup").classList.contains("show"))renderBackup()}});
$("drop").onclick=()=>$("file").click();
$("drop").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();$("file").click()}};
["dragenter","dragover"].forEach(ev=>$("drop").addEventListener(ev,e=>{e.preventDefault();$("drop").classList.add("over")}));
["dragleave","drop"].forEach(ev=>$("drop").addEventListener(ev,e=>{e.preventDefault();$("drop").classList.remove("over")}));
$("drop").addEventListener("drop",e=>{const f=e.dataTransfer.files[0];if(f)importFile(f)});
$("file").onchange=e=>{const f=e.target.files[0];if(f)importFile(f);$("file").value=""};
$("cats").onclick=e=>{const b=e.target.closest("[data-cat]");if(b){cat=b.dataset.cat;render()}};
$("list").onclick=e=>{
  if(e.target.id==="bAddEmpty"){const v=$("q").value.trim();openForm();$("fAbbr").value=v;return}
  const it=e.target.closest(".item");if(!it)return;
  const b=e.target.closest("[data-a]"),id=it.dataset.id,a=b?b.dataset.a:"view";
  if(a==="view")view(id);else if(a==="copy")copyTerm(id);else if(a==="edit")openForm(id);else{const x=terms.find(r=>r.id===id);if(x&&confirm(t("confirmTrash",x.abbr)))trashTerm(id)}
};
$("list").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList.contains("item"))view(e.target.dataset.id)});
document.querySelectorAll(".ov").forEach(o=>o.addEventListener("mousedown",e=>{if(e.target===o)o.classList.remove("show")}));
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")document.querySelectorAll(".ov.show").forEach(o=>o.classList.remove("show"));
  if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!document.querySelector(".ov.show")){e.preventDefault();$("q").focus()}
});
["fAbbr","fFull","fTh","fEx"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")saveForm()}));

load();updateBadge();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
setLang((()=>{try{return localStorage.getItem(LKEY)||"en"}catch(e){return"en"}})());
if(migrateNote)toast(t("dedup",migrateNote),0,t("tipTrash"),()=>{renderTrash();open("ovTrash")},8000);
else if(updateBackupDot())setTimeout(()=>toast(t("nudge"),0,t("exportNow"),exportXLSX,9000),900);
</script>
