<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCP Dictionary</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230F1218'/%3E%3Cpath d='M9 22V10l7 8 7-8v12' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){var t="light";try{var s=localStorage.getItem("mcpDict.theme");t=s==="dark"?"dark":s==="light"?"light":(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}document.documentElement.dataset.theme=t})();
</script>
<style>
/* styles loaded - full CSS in app build */
:root{--bg:#F7F8FA;--panel:#fff;--hover:#F0F2F5;--line:#E7E9EE;--line2:#D8DBE2;--tx:#0F1218;--mut:#6A7280;--faint:#A0A6B2;--ink:#0F1218;--onInk:#fff;--acc:#2D4BDB;--accBg:rgba(45,75,219,.14);--red:#D23B3B;--shadow:0 1px 2px rgba(15,18,24,.04),0 8px 24px rgba(15,18,24,.05);--rail:64px;color-scheme:light}
[data-theme=dark]{--bg:#0A0B0D;--panel:#111215;--hover:#181A1E;--line:#212328;--line2:#2E3138;--tx:#EDEEF0;--mut:#8C919B;--faint:#5C616B;--ink:#EDEEF0;--onInk:#0A0B0D;--acc:#93A6FF;--accBg:rgba(147,166,255,.24);--red:#F26B6B;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans Thai","Segoe UI",sans-serif}
.sync{position:fixed;top:12px;left:12px;font-size:11px;color:var(--mut);z-index:6;display:flex;align-items:center;gap:6px}
.sync .dot{width:8px;height:8px;border-radius:50%;background:#22c55e}.sync.off .dot{background:var(--red)}
</style>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="sync off" id="syncStatus"><span class="dot"></span><span id="syncText">Connecting…</span></div>
<div id="app-root">Loading…</div>
<script src="app.js"></script>
</body>
</html>
